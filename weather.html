<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日天氣｜林鈺晴</title>
  <meta name="description" content="查看台北或目前所在地的即時天氣與未來 7 天預報，並依降雨、溫度與風勢提供帶傘、穿著、跑步與夜遊生活建議。">
  <meta name="theme-color" content="#f4efe4">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRJ8DV18BV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DRJ8DV18BV');
  </script>
  <style>
    :root{--cream:#f4efe4;--paper:#fbf7ee;--ink:#2f2d2a;--brown:#b88e70;--brick:#a86252;--blue:#7c8f97;--olive:#7f8665;--note:#e4d3a1;--line:rgba(47,45,42,.14);--shadow:rgba(47,45,42,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55}
    button,a{font:inherit}.page{width:min(1160px,calc(100% - 36px));margin:auto;padding:32px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}.brand{font-weight:800;letter-spacing:.02em}.back{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
    .hero{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:8px 8px 0 var(--shadow);padding:34px;border-radius:3px}.hero:after{content:"";position:absolute;width:180px;height:54px;background:rgba(228,211,161,.72);right:5%;top:-22px;transform:rotate(3deg)}
    .eyebrow{display:inline-block;background:var(--note);padding:6px 12px;transform:rotate(-1deg);margin-bottom:14px}.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:22px}.hero h1{font-size:clamp(42px,7vw,82px);line-height:1;margin:0 0 12px;letter-spacing:-.04em}.location{font-size:18px;color:#67635e}.loc-btn{border:0;background:var(--olive);color:#fff;padding:13px 18px;box-shadow:5px 5px 0 #5e644b;cursor:pointer;font-weight:700}.loc-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #5e644b}.status{min-height:24px;margin-top:14px;color:#77716a;font-size:14px}
    .current{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:24px}.now-card,.detail-card,.advice-card,.forecast-card{background:var(--paper);border:1px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}.now-card{padding:28px;display:flex;align-items:center;gap:22px}.weather-icon{font-size:74px;line-height:1}.temp{font-size:clamp(54px,8vw,92px);font-weight:800;line-height:.9}.condition{font-size:22px;font-weight:700;margin-top:12px}.feels{color:#77716a;margin-top:5px}.detail-card{padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{border-bottom:1px dashed var(--line);padding-bottom:10px}.metric small{display:block;color:#77716a}.metric strong{font-size:21px}
    .section{margin-top:58px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section h2{font-size:clamp(30px,5vw,48px);margin:0;line-height:1.05}.section-note{color:#77716a;font-size:14px}.advice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.advice-card{padding:22px;min-height:178px}.advice-icon{font-size:30px}.advice-card h3{margin:10px 0 6px;font-size:19px}.advice-card p{margin:0;color:#625e59;font-size:15px}
    .forecast-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.forecast-card{padding:17px 12px;text-align:center}.forecast-card.today{background:#f0e5c5}.day{font-weight:800}.date{font-size:12px;color:#7a756f}.f-icon{font-size:32px;margin:12px 0}.temps{font-weight:800}.low{color:#71838b}.rain{font-size:13px;margin-top:9px;color:#68635d}.rain.yes{color:#8b554a;font-weight:700}
    .footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;color:#77716a;font-size:13px}.footer a{color:inherit}.error{color:var(--brick);font-weight:700}
    @media(max-width:850px){.current{grid-template-columns:1fr}.advice-grid{grid-template-columns:1fr 1fr}.forecast-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:560px){.page{width:min(100% - 24px,1160px);padding-top:18px}.topbar{margin-bottom:20px}.hero{padding:24px 20px}.hero-row{align-items:flex-start;flex-direction:column}.loc-btn{width:100%}.now-card{padding:22px 18px}.weather-icon{font-size:58px}.detail-card{padding:20px 18px}.section{margin-top:42px}.section-head{align-items:flex-start;flex-direction:column}.advice-grid{grid-template-columns:1fr}.forecast-grid{display:flex;overflow-x:auto;padding:2px 6px 12px 0;scroll-snap-type:x mandatory}.forecast-card{min-width:138px;scroll-snap-align:start}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand">林鈺晴 / WEATHER NOTE</div><a class="back" href="index.html">回到首頁 ↗</a></header>
    <section class="hero">
      <span class="eyebrow">Daily Weather</span>
      <div class="hero-row"><div><h1>今天，適合<br>怎麼過？</h1><div class="location" id="locationName">台北</div></div><button class="loc-btn" id="locationBtn" type="button">⌖ 使用我的位置</button></div>
      <div class="status" id="status">正在讀取台北天氣…</div>
    </section>

    <section class="current" aria-label="目前天氣">
      <article class="now-card"><div class="weather-icon" id="nowIcon">☁️</div><div><div class="temp"><span id="nowTemp">--</span>°</div><div class="condition" id="nowCondition">讀取中</div><div class="feels" id="nowFeels">體感溫度 --°C</div></div></article>
      <article class="detail-card">
        <div class="metric"><small>今日最高 / 最低</small><strong id="todayRange">-- / --</strong></div><div class="metric"><small>今日降雨機率</small><strong id="todayRain">--%</strong></div>
        <div class="metric"><small>目前濕度</small><strong id="humidity">--%</strong></div><div class="metric"><small>目前風速</small><strong id="wind">-- km/h</strong></div>
        <div class="metric"><small>日落</small><strong id="sunset">--:--</strong></div><div class="metric"><small>資料時間</small><strong id="updateTime">--:--</strong></div>
      </article>
    </section>

    <section class="section"><div class="section-head"><h2>今日生活提案</h2><div class="section-note">依今天的氣溫、降雨與風勢自動判斷</div></div><div class="advice-grid" id="adviceGrid"></div></section>
    <section class="section"><div class="section-head"><h2>接下來 7 天</h2><div class="section-note">含今天共 8 天｜最高 / 最低溫與降雨機率</div></div><div class="forecast-grid" id="forecastGrid"></div></section>
    <footer class="footer"><span>Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></span><span>預報僅供日常安排參考；劇烈天氣請以當地官方警報為準。</span></footer>
  </main>
<script>
const TAIPEI={lat:25.0330,lon:121.5654,name:'台北'};
const $=id=>document.getElementById(id);
const weatherMap={0:['☀️','晴朗'],1:['🌤️','大致晴朗'],2:['⛅','局部多雲'],3:['☁️','陰天'],45:['🌫️','有霧'],48:['🌫️','霧淞'],51:['🌦️','毛毛雨'],53:['🌦️','毛毛雨'],55:['🌧️','較強毛毛雨'],56:['🌧️','凍毛毛雨'],57:['🌧️','較強凍毛毛雨'],61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],66:['🌧️','凍雨'],67:['🌧️','強凍雨'],71:['🌨️','小雪'],73:['🌨️','中雪'],75:['❄️','大雪'],77:['🌨️','霰'],80:['🌦️','陣雨'],81:['🌧️','陣雨'],82:['⛈️','強陣雨'],85:['🌨️','陣雪'],86:['❄️','強陣雪'],95:['⛈️','雷雨'],96:['⛈️','雷雨伴冰雹'],99:['⛈️','強雷雨伴冰雹']};
function weather(code){return weatherMap[code]||['🌥️','天氣變化中']}
function fmtTime(s){if(!s)return'--:--';return s.slice(11,16)}
function dayLabel(date,i){if(i===0)return'今天';if(i===1)return'明天';return['日','一','二','三','四','五','六'][new Date(date+'T12:00:00').getDay()]+'曜日'}
function dateLabel(date){const d=new Date(date+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function makeAdvice(d){const max=d.daily.temperature_2m_max[0],min=d.daily.temperature_2m_min[0],rain=d.daily.precipitation_probability_max[0]??0,precip=d.daily.precipitation_sum[0]??0,wind=d.daily.wind_speed_10m_max[0]??0,code=d.daily.weather_code[0],sunset=fmtTime(d.daily.sunset[0]);
  const rainy=rain>=40||precip>=1||[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code);
  let wear=min<=14?'早晚偏涼，建議外套＋可分層穿搭。':min<=19?'薄外套或長袖比較穩，白天熱時可脫。':max>=30?'偏熱，選透氣短袖並注意補水防曬。':'短袖或薄長袖都可以，帶件輕薄外層最彈性。';
  let run=rain>=60||precip>=5?'今天戶外跑步不太划算，改室內運動比較舒服。':wind>=35?'風勢偏強，跑步注意逆風與落物，路線別太空曠。':max>=32?'可以跑，但避開中午高溫，清晨或傍晚更適合。':'天氣條件尚可，適合安排戶外慢跑。';
  let night=rain>=60?'晚上仍有較高降雨機率，夜遊建議選有室內備案的行程。':wind>=35?'晚上可以出門，但風較強，騎車或高處活動要多留意。':min<=16?'晚上適合出門，但降溫明顯，記得多帶一層。':`晚上整體可安排散步或夜遊；今日約 ${sunset} 日落。`;
  return[
    ['☂️','要不要帶傘',rainy?`建議帶傘。今日最高降雨機率約 ${Math.round(rain)}%。`:`目前看來不用特地帶大傘；降雨機率約 ${Math.round(rain)}%。`],
    ['👕','怎麼穿',wear],['🏃','適合跑步嗎',run],['🌙','晚上出去嗎',night]
  ];
}
function render(data,name){$('locationName').textContent=name;$('status').textContent=`${name}・${data.timezone_abbreviation||data.timezone}｜Open-Meteo 預報`;
  const w=weather(data.current.weather_code);$('nowIcon').textContent=w[0];$('nowTemp').textContent=Math.round(data.current.temperature_2m);$('nowCondition').textContent=w[1];$('nowFeels').textContent=`體感溫度 ${Math.round(data.current.apparent_temperature)}°C`;
  $('todayRange').textContent=`${Math.round(data.daily.temperature_2m_max[0])}° / ${Math.round(data.daily.temperature_2m_min[0])}°`;$('todayRain').textContent=`${Math.round(data.daily.precipitation_probability_max[0]??0)}%`;$('humidity').textContent=`${Math.round(data.current.relative_humidity_2m)}%`;$('wind').textContent=`${Math.round(data.current.wind_speed_10m)} km/h`;$('sunset').textContent=fmtTime(data.daily.sunset[0]);$('updateTime').textContent=fmtTime(data.current.time);
  $('adviceGrid').innerHTML=makeAdvice(data).map(a=>`<article class="advice-card"><div class="advice-icon">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p></article>`).join('');
  $('forecastGrid').innerHTML=data.daily.time.slice(0,8).map((date,i)=>{const rain=Math.round(data.daily.precipitation_probability_max[i]??0),ww=weather(data.daily.weather_code[i]);return `<article class="forecast-card ${i===0?'today':''}"><div class="day">${dayLabel(date,i)}</div><div class="date">${dateLabel(date)}</div><div class="f-icon">${ww[0]}</div><div class="temps">${Math.round(data.daily.temperature_2m_max[i])}° <span class="low">${Math.round(data.daily.temperature_2m_min[i])}°</span></div><div class="rain ${rain>=40?'yes':''}">☂ ${rain}%</div></article>`}).join('');
}
async function loadWeather(lat,lon,name){$('status').textContent=`正在讀取${name}天氣…`;try{const params=new URLSearchParams({latitude:lat,longitude:lon,timezone:'auto',forecast_days:'8',current:'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,wind_speed_10m_max'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params);if(!r.ok)throw new Error('Weather API error');render(await r.json(),name)}catch(e){console.error(e);$('status').innerHTML='<span class="error">目前無法取得天氣資料，請稍後重新整理。</span>'}}
async function locationName(lat,lon){try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(lat.toFixed(3)+','+lon.toFixed(3))}&count=1&language=zh&format=json`);const j=await r.json();return j.results?.[0]?.name||'我的位置'}catch{return'我的位置'}}
$('locationBtn').addEventListener('click',()=>{if(!navigator.geolocation){$('status').innerHTML='<span class="error">這個瀏覽器不支援定位。</span>';return}$('status').textContent='正在取得你的位置…';navigator.geolocation.getCurrentPosition(async p=>{const {latitude,longitude}=p.coords;await loadWeather(latitude,longitude,'我的位置')},err=>{$('status').innerHTML='<span class="error">無法取得位置。請允許瀏覽器的位置權限後再試一次。</span>';console.warn(err)},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})});
loadWeather(TAIPEI.lat,TAIPEI.lon,TAIPEI.name);
</script>
</body>
</html>
