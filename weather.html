<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="林鈺晴的生活天氣工具：查看台北或目前所在地的即時天氣、未來 8 天預報與穿搭、帶傘、跑步及夜遊建議。" />
  <title>天氣預報｜林鈺晴</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DRJ8DV18BV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DRJ8DV18BV');
  </script>

  <style>
    :root{
      --cream:#f4efe4;
      --paper:#fbf7ee;
      --ink:#2f2d2a;
      --brown:#b88e70;
      --brick:#a86252;
      --blue:#7c8f97;
      --olive:#7f8665;
      --note:#e4d3a1;
      --line:rgba(47,45,42,.18);
      --soft-blue:#dce5e7;
      --soft-olive:#e4e6d7;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Arial Rounded MT Bold","PingFang TC","Noto Sans TC",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 10%,rgba(184,142,112,.09),transparent 24%),
        radial-gradient(circle at 88% 15%,rgba(124,143,151,.09),transparent 24%),
        linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)),
        var(--cream);
      min-height:100vh;
      line-height:1.65;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.16;
      background-image:repeating-linear-gradient(0deg,rgba(47,45,42,.025) 0,rgba(47,45,42,.025) 1px,transparent 1px,transparent 4px);
      mix-blend-mode:multiply;
    }
    a{color:inherit}
    button{font:inherit}
    .wrap{width:min(1120px,calc(100% - 36px));margin:0 auto;position:relative;z-index:1}
    header{padding:24px 0 8px}
    nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:800;text-decoration:none;border-bottom:2px solid var(--ink);letter-spacing:.04em}
    .back{font-size:.94rem;text-underline-offset:4px}

    .hero{padding:44px 0 26px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch}
    .hero-copy,.current-card{background:var(--paper);border:1px solid var(--line);box-shadow:8px 10px 0 rgba(47,45,42,.08)}
    .hero-copy{padding:34px;clip-path:polygon(1% 2%,99% 0,100% 96%,97% 100%,2% 98%,0 7%)}
    .eyebrow{display:inline-block;background:var(--note);padding:7px 11px;transform:rotate(-1deg);margin-bottom:16px}
    h1{font-size:clamp(2.6rem,7vw,5.5rem);line-height:1;margin:0 0 14px;letter-spacing:.02em}
    .lead{font-size:1.02rem;max-width:44rem;margin:0;color:rgba(47,45,42,.76)}
    .location-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:24px}
    .location-name{font-size:1.35rem;font-weight:800}
    .loc-btn{
      appearance:none;border:0;background:var(--olive);color:#fffaf2;font-weight:800;padding:11px 16px;cursor:pointer;
      box-shadow:4px 5px 0 #596047;transition:.2s ease
    }
    .loc-btn:hover{transform:translateY(-2px);box-shadow:3px 4px 0 #596047}
    .loc-btn:disabled{opacity:.6;cursor:wait;transform:none}
    .status{font-size:.86rem;opacity:.68;margin-top:10px;min-height:1.4em}

    .current-card{padding:28px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(.5deg)}
    .current-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .weather-icon{font-size:3rem;line-height:1}
    .temp{font-size:clamp(3rem,8vw,5.5rem);font-weight:800;line-height:.95;margin:8px 0}
    .condition{font-weight:800;font-size:1.15rem}
    .current-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
    .meta-chip{background:var(--soft-blue);padding:12px 13px;border:1px solid rgba(47,45,42,.09)}
    .meta-chip span{display:block;font-size:.78rem;opacity:.68;margin-bottom:2px}

    section{padding:30px 0}
    .section-title{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 18px;display:inline-block;position:relative}
    .section-title::after{content:"";position:absolute;left:3px;right:-7px;bottom:4px;height:9px;background:rgba(168,98,82,.18);z-index:-1;transform:rotate(-1deg)}

    .advice-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .advice-card{background:var(--paper);border:1px solid var(--line);padding:20px;min-height:170px;box-shadow:5px 7px 0 rgba(127,134,101,.12)}
    .advice-card .emoji{font-size:1.7rem}
    .advice-card h3{margin:8px 0 6px;font-size:1.02rem}
    .advice-card p{margin:0;font-size:.92rem;color:rgba(47,45,42,.78)}

    .forecast-scroller{overflow-x:auto;padding:0 2px 10px;scrollbar-width:thin}
    .forecast-grid{display:grid;grid-template-columns:repeat(8,minmax(128px,1fr));gap:12px;min-width:1040px}
    .day-card{background:var(--paper);border:1px solid var(--line);padding:17px 15px;box-shadow:4px 6px 0 rgba(124,143,151,.11)}
    .day-card.today{background:#f0e6c5}
    .day-name{font-weight:800}
    .day-date{font-size:.78rem;opacity:.62}
    .day-icon{font-size:2rem;margin:12px 0 6px}
    .day-condition{font-size:.84rem;min-height:2.7em}
    .temps{display:flex;gap:9px;align-items:baseline;margin-top:10px;font-weight:800}
    .temps .low{opacity:.55}
    .rain{font-size:.82rem;margin-top:8px;color:#526e78}

    .error-box{display:none;background:#f3dfd8;border:1px solid rgba(168,98,82,.25);padding:16px;margin:18px 0}
    .source{font-size:.82rem;opacity:.62;padding:12px 0 50px}
    .source a{text-underline-offset:3px}

    @media(max-width:900px){
      .hero{grid-template-columns:1fr}
      .advice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:600px){
      .wrap{width:calc(100% - 24px)}
      header{padding-top:14px}
      .hero{padding-top:26px;gap:16px}
      .hero-copy,.current-card{padding:22px;clip-path:none;transform:none}
      h1{font-size:clamp(2.6rem,16vw,4rem)}
      .current-meta{grid-template-columns:1fr 1fr}
      .advice-grid{grid-template-columns:1fr}
      .advice-card{min-height:0}
      .forecast-grid{grid-template-columns:repeat(8,138px);min-width:max-content}
      .day-card{padding:15px 13px}
      .loc-btn{width:100%}
      .location-row{align-items:stretch}
      .location-name{width:100%}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="wrap">
    <nav aria-label="頁面導覽">
      <a class="brand" href="index.html">林鈺晴</a>
      <a class="back" href="index.html">← 回到首頁</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Weather Notes</div>
        <h1>今天適合<br>怎麼過？</h1>
        <p class="lead">看即時天氣，也順便幫你把「要不要帶傘、穿什麼、能不能跑步、晚上適不適合出門」一起想完。</p>
        <div class="location-row">
          <div class="location-name" id="locationName">台北</div>
          <button class="loc-btn" id="locationBtn" type="button">使用我的位置</button>
        </div>
        <div class="status" id="status" aria-live="polite">目前顯示台北天氣。</div>
      </div>

      <article class="current-card" aria-live="polite">
        <div>
          <div class="current-top">
            <div>
              <div class="condition" id="currentCondition">載入中⋯</div>
              <div class="temp" id="currentTemp">--°</div>
              <div id="feelsLike">體感 --°C</div>
            </div>
            <div class="weather-icon" id="currentIcon" aria-hidden="true">⛅</div>
          </div>
        </div>
        <div class="current-meta">
          <div class="meta-chip"><span>濕度</span><strong id="humidity">--%</strong></div>
          <div class="meta-chip"><span>風速</span><strong id="wind">-- km/h</strong></div>
          <div class="meta-chip"><span>今日降雨機率</span><strong id="rainChance">--%</strong></div>
          <div class="meta-chip"><span>日落</span><strong id="sunset">--:--</strong></div>
        </div>
      </article>
    </section>

    <div class="error-box" id="errorBox" role="alert"></div>

    <section aria-labelledby="adviceTitle">
      <h2 class="section-title" id="adviceTitle">今天的小建議</h2>
      <div class="advice-grid" id="adviceGrid">
        <article class="advice-card"><div class="emoji">☂️</div><h3>帶傘</h3><p>正在看天空⋯</p></article>
        <article class="advice-card"><div class="emoji">🧥</div><h3>穿搭</h3><p>正在感受溫度⋯</p></article>
        <article class="advice-card"><div class="emoji">🏃</div><h3>跑步</h3><p>正在評估戶外條件⋯</p></article>
        <article class="advice-card"><div class="emoji">🌙</div><h3>夜遊</h3><p>正在看看晚上的天氣⋯</p></article>
      </div>
    </section>

    <section aria-labelledby="forecastTitle">
      <h2 class="section-title" id="forecastTitle">今天＋接下來 7 天</h2>
      <div class="forecast-scroller" tabindex="0" aria-label="8 天天氣預報，可左右滑動">
        <div class="forecast-grid" id="forecastGrid"></div>
      </div>
    </section>

    <div class="source">天氣資料來自 <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>。預報與生活建議僅供日常參考。</div>
  </main>

<script>
  const TAIPEI = { lat: 25.0330, lon: 121.5654, name: '台北' };

  const els = {
    locationName: document.getElementById('locationName'),
    locationBtn: document.getElementById('locationBtn'),
    status: document.getElementById('status'),
    currentCondition: document.getElementById('currentCondition'),
    currentTemp: document.getElementById('currentTemp'),
    feelsLike: document.getElementById('feelsLike'),
    currentIcon: document.getElementById('currentIcon'),
    humidity: document.getElementById('humidity'),
    wind: document.getElementById('wind'),
    rainChance: document.getElementById('rainChance'),
    sunset: document.getElementById('sunset'),
    forecastGrid: document.getElementById('forecastGrid'),
    adviceGrid: document.getElementById('adviceGrid'),
    errorBox: document.getElementById('errorBox')
  };

  function weatherInfo(code, isDay = 1) {
    const map = {
      0: [isDay ? '☀️' : '🌙', '晴朗'],
      1: [isDay ? '🌤️' : '🌙', '大致晴朗'],
      2: ['⛅', '局部多雲'],
      3: ['☁️', '多雲'],
      45: ['🌫️', '有霧'],
      48: ['🌫️', '霧淞'],
      51: ['🌦️', '毛毛雨'], 53: ['🌦️', '毛毛雨'], 55: ['🌧️', '較強毛毛雨'],
      56: ['🌧️', '凍毛毛雨'], 57: ['🌧️', '較強凍毛毛雨'],
      61: ['🌦️', '小雨'], 63: ['🌧️', '中雨'], 65: ['🌧️', '大雨'],
      66: ['🌧️', '凍雨'], 67: ['🌧️', '較強凍雨'],
      71: ['🌨️', '小雪'], 73: ['🌨️', '中雪'], 75: ['❄️', '大雪'], 77: ['❄️', '雪粒'],
      80: ['🌦️', '短暫陣雨'], 81: ['🌧️', '陣雨'], 82: ['⛈️', '強陣雨'],
      85: ['🌨️', '陣雪'], 86: ['🌨️', '強陣雪'],
      95: ['⛈️', '雷雨'], 96: ['⛈️', '雷雨伴冰雹'], 99: ['⛈️', '強雷雨伴冰雹']
    };
    return map[code] || ['🌤️', '天氣變化'];
  }

  function formatClock(iso) {
    if (!iso) return '--:--';
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return iso.slice(11,16) || '--:--';
    return new Intl.DateTimeFormat('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
  }

  function formatDate(iso, index) {
    const date = new Date(iso + 'T12:00:00');
    const weekday = new Intl.DateTimeFormat('zh-TW', { weekday: 'short' }).format(date);
    const md = new Intl.DateTimeFormat('zh-TW', { month: 'numeric', day: 'numeric' }).format(date);
    return { name: index === 0 ? '今天' : weekday, date: md };
  }

  function apiUrl(lat, lon) {
    const params = new URLSearchParams({
      latitude: lat,
      longitude: lon,
      timezone: 'auto',
      forecast_days: '8',
      current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,sunrise,sunset'
    });
    return `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
  }

  async function loadWeather(lat, lon, name) {
    els.errorBox.style.display = 'none';
    els.status.textContent = `正在更新${name}天氣⋯`;
    try {
      const response = await fetch(apiUrl(lat, lon), { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      renderWeather(data, name);
      els.status.textContent = `目前顯示${name}天氣。`;
    } catch (error) {
      console.error(error);
      els.errorBox.textContent = '天氣資料暫時載入失敗，請稍後重新整理頁面。';
      els.errorBox.style.display = 'block';
      els.status.textContent = '更新失敗。';
    }
  }

  function renderWeather(data, name) {
    els.locationName.textContent = name;
    const current = data.current || {};
    const daily = data.daily || {};
    const [icon, label] = weatherInfo(current.weather_code, current.is_day);

    els.currentCondition.textContent = label;
    els.currentIcon.textContent = icon;
    els.currentTemp.textContent = Number.isFinite(current.temperature_2m) ? `${Math.round(current.temperature_2m)}°` : '--°';
    els.feelsLike.textContent = Number.isFinite(current.apparent_temperature) ? `體感 ${Math.round(current.apparent_temperature)}°C` : '體感 --°C';
    els.humidity.textContent = Number.isFinite(current.relative_humidity_2m) ? `${Math.round(current.relative_humidity_2m)}%` : '--%';
    els.wind.textContent = Number.isFinite(current.wind_speed_10m) ? `${Math.round(current.wind_speed_10m)} km/h` : '-- km/h';
    els.rainChance.textContent = Number.isFinite(daily.precipitation_probability_max?.[0]) ? `${Math.round(daily.precipitation_probability_max[0])}%` : '--%';
    els.sunset.textContent = formatClock(daily.sunset?.[0]);

    renderForecast(daily);
    renderAdvice(current, daily);
  }

  function renderForecast(daily) {
    els.forecastGrid.innerHTML = '';
    const times = daily.time || [];
    times.forEach((date, i) => {
      const { name, date: md } = formatDate(date, i);
      const [icon, label] = weatherInfo(daily.weather_code?.[i], 1);
      const max = daily.temperature_2m_max?.[i];
      const min = daily.temperature_2m_min?.[i];
      const rain = daily.precipitation_probability_max?.[i];
      const rainSum = daily.precipitation_sum?.[i];
      const rainy = (Number.isFinite(rain) && rain >= 40) || (Number.isFinite(rainSum) && rainSum > 0.5);

      const card = document.createElement('article');
      card.className = `day-card${i === 0 ? ' today' : ''}`;
      card.innerHTML = `
        <div class="day-name">${name}</div>
        <div class="day-date">${md}</div>
        <div class="day-icon" aria-hidden="true">${icon}</div>
        <div class="day-condition">${label}</div>
        <div class="temps"><span>${Number.isFinite(max) ? Math.round(max) : '--'}°</span><span class="low">${Number.isFinite(min) ? Math.round(min) : '--'}°</span></div>
        <div class="rain">${rainy ? '🌧 可能下雨' : '☁️ 降雨偏低'}${Number.isFinite(rain) ? ` · ${Math.round(rain)}%` : ''}</div>`;
      els.forecastGrid.appendChild(card);
    });
  }

  function renderAdvice(current, daily) {
    const max = daily.temperature_2m_max?.[0];
    const min = daily.temperature_2m_min?.[0];
    const rain = daily.precipitation_probability_max?.[0] ?? 0;
    const rainSum = daily.precipitation_sum?.[0] ?? 0;
    const windMax = daily.wind_speed_10m_max?.[0] ?? current.wind_speed_10m ?? 0;
    const code = daily.weather_code?.[0] ?? current.weather_code;

    const umbrella = (rain >= 50 || rainSum >= 1 || [61,63,65,80,81,82,95,96,99].includes(code))
      ? ['☂️','帶傘','今天下雨機率不低，建議帶傘；如果包包小，摺疊傘就別再跟自己賭了。']
      : rain >= 30
      ? ['🌂','帶傘','有一些降雨機會，長時間在外的話帶把小傘比較保險。']
      : ['👜','帶傘','降雨機率偏低，短程外出可以輕裝；仍可留意午後局部天氣變化。'];

    let clothes;
    if (Number.isFinite(min) && min < 16) clothes = ['🧥','穿搭','早晚偏涼，建議長袖加外套；怕冷的話不要只相信中午的太陽。'];
    else if (Number.isFinite(max) && max >= 30) clothes = ['👕','穿搭','白天偏熱，透氣短袖較舒服；室內冷氣強可帶薄外套。'];
    else if (Number.isFinite(min) && min < 21) clothes = ['🧶','穿搭','體感舒適但早晚略涼，薄長袖或一件輕外套最穩。'];
    else clothes = ['👚','穿搭','溫度偏舒適，輕薄衣物即可，依冷氣環境準備薄外套。'];

    let run;
    if (rain >= 60 || rainSum >= 3 || [95,96,99].includes(code)) run = ['🏠','跑步','今天不太適合戶外跑步，雨勢或雷雨風險較高，改室內運動更實際。'];
    else if (windMax >= 35) run = ['💨','跑步','風偏強，戶外跑步體感可能不穩；選避風路線或改成低強度。'];
    else if (Number.isFinite(max) && max >= 32) run = ['🥵','跑步','白天偏熱，建議避開中午，改清晨或傍晚並注意補水。'];
    else run = ['🏃','跑步','整體條件還可以，適合戶外跑步；出發前再看一下即時降雨即可。'];

    let night;
    if (rain >= 60 || rainSum >= 3 || [95,96,99].includes(code)) night = ['🌧️','夜遊','晚上外出舒適度普通，建議選室內行程或縮短在戶外停留的時間。'];
    else if (Number.isFinite(min) && min < 17) night = ['🌙','夜遊','可以出門，但晚上會偏涼，帶件外套會比硬撐有尊嚴。'];
    else night = ['✨','夜遊','晚上整體適合外出散步或夜遊，記得依實際風勢與降雨再調整。'];

    const cards = [umbrella, clothes, run, night];
    els.adviceGrid.innerHTML = cards.map(([emoji,title,text]) => `
      <article class="advice-card"><div class="emoji">${emoji}</div><h3>${title}</h3><p>${text}</p></article>`
    ).join('');
  }

  els.locationBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      els.status.textContent = '這個瀏覽器不支援定位功能。';
      return;
    }
    els.locationBtn.disabled = true;
    els.locationBtn.textContent = '正在取得位置⋯';
    els.status.textContent = '正在向瀏覽器取得你的所在地⋯';

    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        loadWeather(latitude, longitude, '目前位置');
        els.locationBtn.disabled = false;
        els.locationBtn.textContent = '重新取得我的位置';
      },
      err => {
        console.warn(err);
        const message = err.code === 1
          ? '沒有取得定位權限，仍顯示台北天氣。'
          : '暫時無法取得位置，仍顯示台北天氣。';
        els.status.textContent = message;
        els.locationBtn.disabled = false;
        els.locationBtn.textContent = '使用我的位置';
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
    );
  });

  loadWeather(TAIPEI.lat, TAIPEI.lon, TAIPEI.name);
</script>
</body>
</html>
