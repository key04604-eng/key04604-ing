<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05020b" />
  <title>Galaxian 小蜜蜂</title>
  <style>
    :root{--bg:#05020b;--cyan:#38f7ff;--pink:#ff3fd8;--purple:#8b5cff;--yellow:#ffe86b;--green:#68ff9a;--white:#f8f7ff;--panel:rgba(10,5,24,.84)}
    *{box-sizing:border-box} html,body{width:100%;min-height:100%;margin:0;background:radial-gradient(circle at 50% 115%,rgba(255,63,216,.23),transparent 28%),linear-gradient(#06020d 0%,#090319 58%,#12032b 100%);color:var(--white);font-family:"Courier New","PingFang TC","Noto Sans TC",monospace;overflow-x:hidden}
    body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:14px;image-rendering:pixelated}.shell{width:min(100%,760px);position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}.home{color:var(--cyan);text-decoration:none;font-weight:800;text-shadow:0 0 8px rgba(56,247,255,.7);border:2px solid var(--cyan);padding:8px 10px;box-shadow:0 0 0 2px rgba(56,247,255,.08),0 0 16px rgba(56,247,255,.23);background:#080313}.home:hover{background:#0e0820}.title{margin:0;font-size:clamp(18px,4vw,30px);letter-spacing:.08em;color:var(--pink);text-shadow:3px 3px 0 #49205d,0 0 12px rgba(255,63,216,.65)}
    .hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}.hud-box{border:2px solid var(--purple);background:var(--panel);padding:8px 12px;box-shadow:inset 0 0 16px rgba(139,92,255,.12),0 0 14px rgba(139,92,255,.15);font-weight:800;letter-spacing:.04em}.hud-box span{color:var(--yellow);text-shadow:0 0 8px rgba(255,232,107,.6)}
    .game-wrap{position:relative;width:100%;aspect-ratio:4/5;max-height:78dvh;min-height:420px;border:3px solid var(--cyan);background:#030108;box-shadow:0 0 0 3px #1e0a34,0 0 24px rgba(56,247,255,.3),inset 0 0 30px rgba(139,92,255,.18);overflow:hidden}canvas{width:100%;height:100%;display:block;background:transparent;image-rendering:pixelated;touch-action:none}.scanlines{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;opacity:.42}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(2,0,8,.72);backdrop-filter:blur(2px);z-index:4}.overlay.hidden{display:none}.panel{width:min(92%,420px);border:3px solid var(--pink);background:#080313;padding:22px;text-align:center;box-shadow:8px 8px 0 #351049,0 0 26px rgba(255,63,216,.32)}.panel h2{color:var(--pink);margin:0 0 12px;font-size:clamp(26px,8vw,44px);text-shadow:3px 3px 0 #471558,0 0 10px rgba(255,63,216,.55)}.panel p{margin:7px 0;line-height:1.6}.panel strong{color:var(--yellow)}.btn{appearance:none;border:2px solid var(--cyan);background:#0a0615;color:var(--white);font:inherit;font-weight:900;padding:11px 16px;margin-top:12px;cursor:pointer;box-shadow:4px 4px 0 #11404c,0 0 14px rgba(56,247,255,.26)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #11404c}
    .touch-controls{display:none;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:12px;touch-action:none}.touch-btn{user-select:none;-webkit-user-select:none;min-height:58px;border:2px solid var(--cyan);background:#080313;color:var(--white);font:inherit;font-weight:900;font-size:20px;box-shadow:4px 4px 0 #143743,0 0 12px rgba(56,247,255,.15)}.touch-btn.fire{border-color:var(--pink);box-shadow:4px 4px 0 #4b1749,0 0 12px rgba(255,63,216,.18);color:var(--yellow)}.touch-btn.active,.touch-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 currentColor;filter:brightness(1.25)}.hint{margin:10px 2px 0;color:#b7aed0;font-size:12px;line-height:1.55;text-align:center}
    @media (hover:none),(pointer:coarse),(max-width:760px){.touch-controls{display:grid}.game-wrap{max-height:none}.hint .desktop-only{display:none}}@media (max-width:520px){body{padding:8px}.topbar{align-items:flex-start}.title{width:100%;order:-1}.hud{gap:6px}.hud-box{padding:7px 8px;font-size:13px}.game-wrap{min-height:0;aspect-ratio:3/4}.touch-btn{min-height:54px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><h1 class="title">GALAXIAN 小蜜蜂</h1><a class="home" href="index.html">← 回首頁</a></div>
    <section class="hud" aria-label="遊戲資訊"><div class="hud-box">分數：<span id="score">0</span></div><div class="hud-box">最高分：<span id="highScore">0</span></div></section>
    <div class="game-wrap">
      <canvas id="game" width="480" height="600" aria-label="Galaxian 小蜜蜂遊戲畫面"></canvas><div class="scanlines"></div>
      <div class="overlay" id="startOverlay"><div class="panel"><h2>準備出擊</h2><p>← → 移動</p><p>空白鍵發射</p><p>手機請使用下方觸控按鈕</p><button class="btn" id="startBtn">開始遊戲</button></div></div>
      <div class="overlay hidden" id="gameOverOverlay"><div class="panel"><h2>遊戲結束</h2><p>本次分數：<strong id="finalScore">0</strong></p><p>最高分：<strong id="finalHighScore">0</strong></p><button class="btn" id="restartBtn">重新開始</button></div></div>
    </div>
    <div class="touch-controls" aria-label="手機觸控操作"><button class="touch-btn" id="leftBtn" aria-label="向左">←</button><button class="touch-btn" id="rightBtn" aria-label="向右">→</button><button class="touch-btn fire" id="fireBtn" aria-label="發射">發射</button></div>
    <p class="hint"><span class="desktop-only">電腦：← → 移動，空白鍵發射。</span> 擊落敵機可得分；敵機撞到你或突破底線就會結束。</p>
  </main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const scoreEl=document.getElementById('score'),highScoreEl=document.getElementById('highScore'),finalScoreEl=document.getElementById('finalScore'),finalHighScoreEl=document.getElementById('finalHighScore'),startOverlay=document.getElementById('startOverlay'),gameOverOverlay=document.getElementById('gameOverOverlay'),startBtn=document.getElementById('startBtn'),restartBtn=document.getElementById('restartBtn');
const W=canvas.width,H=canvas.height,HIGH_KEY='galaxian_high_score_v1';let highScore=Number(localStorage.getItem(HIGH_KEY)||0);highScoreEl.textContent=highScore;
const keys={left:false,right:false,fire:false};let running=false,lastTime=0,score=0,wave=0,stars=[],bullets=[],enemyBullets=[],enemies=[],particles=[],player,fireCooldown=0,enemyFireTimer=0,formationTime=0,nextDiveTimer=0;
const palette={cyan:'#38f7ff',pink:'#ff3fd8',purple:'#8b5cff',yellow:'#ffe86b',green:'#68ff9a',white:'#f8f7ff',red:'#ff526e'};
function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawPixelSprite(pattern,x,y,scale,colors){for(let r=0;r<pattern.length;r++)for(let c=0;c<pattern[r].length;c++){const ch=pattern[r][c];if(ch!=='.')pixelRect(x+c*scale,y+r*scale,scale,scale,colors[ch]||palette.white)}}
const playerSprite=['....C....','....C....','...CCC...','..CCCCC..','.CCWCWCC.','CCCCCCCCC','CC.PPP.CC','C..PPP..C'];
const enemySprites=[['..P.P..','.PPPPP.','PPWPWPP','PPPPPPP','.P.P.P.','P.....P'],['..Y.Y..','.YYYYY.','YYWYWYY','YYYYYYY','.Y.Y.Y.','Y.....Y'],['..G.G..','.GGGGG.','GGWGWGG','GGGGGGG','.G.G.G.','G.....G']];
function makeStars(){stars=Array.from({length:95},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.82?1:2,v:.25+Math.random()*1.1,c:Math.random()<.7?'#7ac7ff':(Math.random()<.5?'#ff78dd':'#ffffff')}))}
function resetGame(){score=0;wave=0;bullets=[];enemyBullets=[];particles=[];formationTime=0;enemyFireTimer=.9;nextDiveTimer=1.2;fireCooldown=0;player={x:W/2,y:H-58,w:36,h:32,speed:245};scoreEl.textContent='0';spawnWave()}
function spawnWave(){wave++;enemies=[];const cols=8,rows=4,gapX=46,gapY=40,startX=W/2-((cols-1)*gapX)/2,startY=86;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({baseX:startX+c*gapX,baseY:startY+r*gapY,x:startX+c*gapX,y:startY+r*gapY,w:28,h:24,alive:true,type:r%3,row:r,col:c,diving:false,diveT:0,diveSide:Math.random()<.5?-1:1,speed:1+wave*.08})}
function startGame(){resetGame();running=true;startOverlay.classList.add('hidden');gameOverOverlay.classList.add('hidden');lastTime=performance.now();requestAnimationFrame(loop)}
function endGame(){if(!running)return;running=false;if(score>highScore){highScore=score;localStorage.setItem(HIGH_KEY,String(highScore));highScoreEl.textContent=highScore}finalScoreEl.textContent=score;finalHighScoreEl.textContent=highScore;gameOverOverlay.classList.remove('hidden')}
function shoot(){if(fireCooldown>0||!running)return;bullets.push({x:player.x,y:player.y-18,vy:-430,w:4,h:12});fireCooldown=.18}
function enemyShoot(e){enemyBullets.push({x:e.x,y:e.y+14,vy:165+wave*6,vx:(player.x-e.x)*.09,w:4,h:10})}
function explode(x,y,color){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,max:.8,color})}}
function rectHit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}
function update(dt){if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;player.x=Math.max(24,Math.min(W-24,player.x));if(keys.fire)shoot();fireCooldown=Math.max(0,fireCooldown-dt);enemyFireTimer-=dt;nextDiveTimer-=dt;formationTime+=dt;
for(const s of stars){s.y+=s.v*30*dt;if(s.y>H){s.y=-2;s.x=Math.random()*W}}
bullets.forEach(b=>b.y+=b.vy*dt);bullets=bullets.filter(b=>b.y>-30);enemyBullets.forEach(b=>{b.y+=b.vy*dt;b.x+=b.vx*dt});enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.x>-30&&b.x<W+30);
const alive=enemies.filter(e=>e.alive);if(nextDiveTimer<=0&&alive.length){const candidates=alive.filter(e=>!e.diving);if(candidates.length){const e=candidates[Math.floor(Math.random()*candidates.length)];e.diving=true;e.diveT=0;e.diveSide=e.x<W/2?1:-1}nextDiveTimer=Math.max(.65,2.2-wave*.08)+Math.random()*1.15}
enemies.forEach(e=>{if(!e.alive)return;if(e.diving){e.diveT+=dt*e.speed;const t=e.diveT;e.y=e.baseY+t*155;e.x=e.baseX+Math.sin(t*3.4)*78*e.diveSide+Math.sin(t*1.5)*28;if(e.y>H+34)endGame()}else{e.x=e.baseX+Math.sin(formationTime*1.45+e.row*.35)*14;e.y=e.baseY+Math.sin(formationTime*1.8+e.col*.25)*4}});
if(enemyFireTimer<=0&&alive.length){const shooters=alive.filter(e=>e.y<H-100);if(shooters.length)enemyShoot(shooters[Math.floor(Math.random()*shooters.length)]);enemyFireTimer=Math.max(.45,1.05-wave*.035)+Math.random()*.65}
for(const b of bullets)for(const e of enemies){if(!e.alive)continue;if(rectHit(b,e)){e.alive=false;b.y=-100;score+=e.diving?180:100;scoreEl.textContent=score;explode(e.x,e.y,[palette.pink,palette.yellow,palette.green][e.type]);break}}
for(const b of enemyBullets)if(rectHit(b,player)){explode(player.x,player.y,palette.cyan);endGame();return}for(const e of enemies)if(e.alive&&rectHit(e,player)){explode(player.x,player.y,palette.cyan);endGame();return}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(enemies.every(e=>!e.alive)){score+=500;scoreEl.textContent=score;spawnWave()}}
function drawBackground(){ctx.fillStyle='#030108';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.55+Math.sin((s.x+s.y)*.02)*.25;pixelRect(s.x,s.y,s.s,s.s,s.c)}ctx.globalAlpha=1;const horizon=H*.72,grad=ctx.createLinearGradient(0,horizon-80,0,H);grad.addColorStop(0,'rgba(255,63,216,0)');grad.addColorStop(1,'rgba(255,63,216,.16)');ctx.fillStyle=grad;ctx.fillRect(0,horizon-80,W,H-horizon+80);ctx.strokeStyle='rgba(139,92,255,.23)';ctx.lineWidth=1;for(let y=horizon;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-W;x<W*2;x+=44){ctx.beginPath();ctx.moveTo(W/2,horizon);ctx.lineTo(x,H);ctx.stroke()}}
function drawPlayer(){drawPixelSprite(playerSprite,player.x-18,player.y-16,4,{C:palette.cyan,W:palette.white,P:palette.pink})}
function drawEnemy(e){const s=enemySprites[e.type],m=e.type===0?{P:palette.pink,W:palette.white}:e.type===1?{Y:palette.yellow,W:palette.white}:{G:palette.green,W:palette.white};drawPixelSprite(s,e.x-14,e.y-12,4,m)}
function draw(){drawBackground();enemies.forEach(e=>{if(e.alive)drawEnemy(e)});bullets.forEach(b=>{pixelRect(b.x-2,b.y-6,4,12,palette.cyan);pixelRect(b.x-1,b.y-9,2,4,palette.white)});enemyBullets.forEach(b=>{pixelRect(b.x-2,b.y-5,4,10,palette.pink);pixelRect(b.x-1,b.y+4,2,4,palette.yellow)});particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);pixelRect(p.x,p.y,3,3,p.color)});ctx.globalAlpha=1;if(player)drawPlayer();ctx.fillStyle='rgba(56,247,255,.8)';ctx.font='12px "Courier New", monospace';ctx.fillText(`第 ${wave||1} 波`,12,20)}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-lastTime)/1000||0);lastTime=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'){keys.fire=true;shoot()}},{passive:false});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='Space')keys.fire=false});
function bindHold(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('active');if(key==='fire')shoot()},off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}bindHold('leftBtn','left');bindHold('rightBtn','right');bindHold('fireBtn','fire');startBtn.addEventListener('click',startGame);restartBtn.addEventListener('click',startGame);window.addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false});makeStars();resetGame();draw();})();
</script>
</body>
</html>
