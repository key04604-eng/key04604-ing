<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>黑白機連線猜拳</title>

  <style>
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --white:#f4f4f4;
      --gray:#a9a9a9;
      --mid:#5f5f5f;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#000;
      color:var(--white);
      font-family:"Courier New","PingFang TC","Microsoft JhengHei",monospace;
    }

    body{
      min-height:100dvh;
      padding:10px;
      overflow-x:hidden;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.03) 0,
          rgba(255,255,255,.03) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at 50% 0,#222 0,#090909 45%,#000 100%);
      image-rendering:pixelated;
    }

    button,input{
      font:inherit;
      border-radius:0;
    }

    button{
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .app{
      width:min(100%,760px);
      margin:0 auto;
    }

    .machine{
      border:4px solid var(--white);
      background:var(--panel);
      box-shadow:7px 7px 0 var(--mid);
      padding:14px;
    }

    .title{
      margin:4px 0 6px;
      text-align:center;
      font-size:clamp(28px,9vw,54px);
      line-height:1;
      letter-spacing:.08em;
      text-shadow:4px 4px 0 #555;
    }

    .sub{
      margin:0 0 14px;
      text-align:center;
      color:var(--gray);
      font-size:12px;
      line-height:1.6;
    }

    .pixel-line{
      height:8px;
      margin:12px 0 14px;
      border:1px solid #777;
      background:repeating-linear-gradient(90deg,#fff 0 8px,#000 8px 16px);
    }

    .screen{
      border:3px solid var(--white);
      background:#030303;
      padding:14px;
      box-shadow:inset 0 0 0 3px #222;
    }

    .screen.hidden{display:none}

    h2{
      margin:0 0 12px;
      font-size:17px;
      letter-spacing:.05em;
    }

    .field{margin-bottom:10px}

    .label{
      display:block;
      margin-bottom:6px;
      color:var(--gray);
      font-size:12px;
    }

    .input{
      width:100%;
      min-height:52px;
      padding:10px 12px;
      border:3px solid var(--white);
      background:#000;
      color:#fff;
      outline:none;
      font-size:16px;
    }

    .input:focus{
      box-shadow:0 0 0 3px #666;
    }

    .btn{
      width:100%;
      min-height:54px;
      border:3px solid var(--white);
      background:var(--white);
      color:#000;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      box-shadow:4px 4px 0 #606060;
    }

    .btn.secondary{
      background:#000;
      color:var(--white);
    }

    .btn.small{
      width:auto;
      min-height:38px;
      padding:6px 9px;
      font-size:12px;
    }

    .btn:active{
      transform:translate(3px,3px);
      box-shadow:1px 1px 0 #606060;
    }

    .btn:disabled{
      opacity:.38;
      cursor:not-allowed;
      transform:none;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:10px;
      margin:16px 0;
      color:var(--gray);
      font-size:12px;
    }

    .divider:before,
    .divider:after{
      content:"";
      flex:1;
      height:2px;
      background:#555;
    }

    .room-code{
      margin:6px 0 8px;
      text-align:center;
      font-size:clamp(38px,13vw,72px);
      line-height:1;
      letter-spacing:.14em;
    }

    .room-meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      margin-bottom:12px;
    }

    .badge{
      border:2px solid #fff;
      background:#000;
      padding:5px 8px;
      font-size:11px;
    }

    .players{
      display:grid;
      gap:8px;
    }

    .player{
      display:grid;
      grid-template-columns:30px 1fr auto;
      align-items:center;
      gap:8px;
      padding:9px;
      border:2px solid #666;
      background:#080808;
    }

    .player.me{
      border-color:#fff;
    }

    .slot{
      width:28px;
      height:28px;
      border:2px solid #fff;
      display:grid;
      place-items:center;
      font-weight:900;
    }

    .player-name{
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .player-state{
      color:var(--gray);
      font-size:11px;
      text-align:right;
    }

    .choice-area{
      margin-top:14px;
    }

    .choices{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .choice{
      min-height:92px;
      border:3px solid #fff;
      background:#000;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      box-shadow:4px 4px 0 #555;
      font-size:15px;
      line-height:1.5;
    }

    .choice.selected{
      background:#fff;
      color:#000;
    }

    .choice:disabled{
      opacity:.35;
      cursor:not-allowed;
    }

    .choice:active:not(:disabled){
      transform:translate(3px,3px);
      box-shadow:1px 1px 0 #555;
    }

    .result{
      margin-top:14px;
      padding:14px;
      border:3px double #fff;
      background:#000;
    }

    .result.hidden{display:none}

    .result-title{
      margin:0 0 10px;
      text-align:center;
      font-size:24px;
      letter-spacing:.07em;
    }

    .reveal{
      display:grid;
      gap:4px;
    }

    .reveal-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      padding:7px 0;
      border-bottom:1px dashed #555;
    }

    .reveal-row:last-child{border-bottom:0}

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:12px;
    }

    .status{
      min-height:1.4em;
      margin:10px 0 0;
      color:var(--gray);
      font-size:12px;
      line-height:1.55;
      word-break:break-word;
    }

    .status.error{
      padding:8px;
      border:2px solid #fff;
      background:#421111;
      color:#fff;
    }

    .footer-note{
      margin:14px 2px 0;
      color:#8e8e8e;
      font-size:10px;
      line-height:1.65;
    }

    @media (max-width:560px){
      body{padding:7px}
      .machine{
        padding:10px;
        box-shadow:5px 5px 0 var(--mid);
      }
      .two,
      .actions{
        grid-template-columns:1fr;
      }
      .room-meta{
        justify-content:flex-start;
      }
      .choices{
        gap:6px;
      }
      .choice{
        min-height:80px;
        padding:6px 3px;
        font-size:13px;
      }
      .player{
        grid-template-columns:28px 1fr auto;
        padding:8px;
      }
      .btn{
        min-height:52px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="machine">
      <h1 class="title">RPS LINK</h1>
      <p class="sub">黑白機連線猜拳｜2～3 人｜Firebase Realtime Database</p>

      <div class="pixel-line" aria-hidden="true"></div>

      <section class="screen" id="lobbyScreen">
        <h2>01 / 建立或加入房間</h2>

        <div class="field">
          <label class="label" for="nicknameInput">玩家暱稱</label>
          <input
            class="input"
            id="nicknameInput"
            maxlength="12"
            autocomplete="nickname"
            placeholder="輸入暱稱"
          />
        </div>

        <div class="divider">建立房間</div>

        <button class="btn" id="createRoomBtn">
          產生 4 位數房號
        </button>

        <div class="divider">加入房間</div>

        <div class="two">
          <input
            class="input"
            id="roomCodeInput"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            placeholder="輸入 4 位數房號"
          />
          <button class="btn secondary" id="joinRoomBtn">
            加入房間
          </button>
        </div>

        <p class="status" id="lobbyStatus"></p>
      </section>

      <section class="screen hidden" id="roomScreen">
        <h2>02 / ROOM</h2>

        <div class="room-code" id="roomCodeText">0000</div>

        <div class="room-meta">
          <span class="badge" id="playerCountBadge">玩家 0 / 3</span>
          <span class="badge" id="roundBadge">ROUND 0</span>
          <button class="btn small secondary" id="copyRoomBtn">
            複製房號
          </button>
        </div>

        <div class="players" id="playersList"></div>

        <div class="choice-area">
          <div class="choices">
            <button class="choice" data-choice="rock">
              石頭<br />ROCK
            </button>
            <button class="choice" data-choice="scissors">
              剪刀<br />SCISSORS
            </button>
            <button class="choice" data-choice="paper">
              布<br />PAPER
            </button>
          </div>
        </div>

        <div class="result hidden" id="resultBox">
          <h3 class="result-title" id="resultTitle">RESULT</h3>
          <div class="reveal" id="revealList"></div>

          <div class="actions">
            <button class="btn" id="nextRoundBtn">
              下一回合
            </button>
            <button class="btn secondary" id="claimHostBtn">
              接手房主
            </button>
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="startGameBtn">
            開始猜拳
          </button>
          <button class="btn secondary" id="leaveRoomBtn">
            離開房間
          </button>
        </div>

        <p class="status" id="roomStatus"></p>
      </section>

      <p class="footer-note">
        Firebase Modular SDK 版｜join fix v2。建議上傳 GitHub Pages 後，用兩台裝置測試連線。
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      runTransaction,
      onValue,
      onDisconnect
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    /* ============================================================
       Firebase Config：已填入你的設定
       ============================================================ */

    const firebaseConfig = {
      apiKey: "AIzaSyBm79lIj7a0xsa8LIkhot1WwOWvlybfC4w",
      authDomain: "ching-6a72f.firebaseapp.com",
      databaseURL: "https://ching-6a72f-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ching-6a72f",
      storageBucket: "ching-6a72f.firebasestorage.app",
      messagingSenderId: "599960713563",
      appId: "1:599960713563:web:57303220d97bc14107027e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];

    const lobbyScreen = $("#lobbyScreen");
    const roomScreen = $("#roomScreen");

    const nicknameInput = $("#nicknameInput");
    const roomCodeInput = $("#roomCodeInput");

    const createRoomBtn = $("#createRoomBtn");
    const joinRoomBtn = $("#joinRoomBtn");

    const lobbyStatus = $("#lobbyStatus");
    const roomStatus = $("#roomStatus");

    const roomCodeText = $("#roomCodeText");
    const playerCountBadge = $("#playerCountBadge");
    const roundBadge = $("#roundBadge");
    const copyRoomBtn = $("#copyRoomBtn");

    const playersList = $("#playersList");
    const choiceButtons = $$(".choice");

    const startGameBtn = $("#startGameBtn");
    const leaveRoomBtn = $("#leaveRoomBtn");

    const resultBox = $("#resultBox");
    const resultTitle = $("#resultTitle");
    const revealList = $("#revealList");

    const nextRoundBtn = $("#nextRoundBtn");
    const claimHostBtn = $("#claimHostBtn");

    const playerId = makeId();

    let roomCode = "";
    let roomDatabaseRef = null;
    let currentRoom = null;
    let unsubscribeRoom = null;
    let playerDisconnect = null;

    nicknameInput.value =
      localStorage.getItem("rps_player_name") || "";

    function makeId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID().replaceAll("-", "");
      }

      return (
        "p_" +
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }

    function setStatus(element, message, isError = false) {
      element.textContent = message || "";
      element.classList.toggle("error", Boolean(isError));
    }

    function cleanNickname(value) {
      return String(value || "")
        .trim()
        .replace(/[<>]/g, "")
        .slice(0, 12);
    }

    function randomRoomCode() {
      return String(
        Math.floor(1000 + Math.random() * 9000)
      );
    }

    function makePlayer(name) {
      return {
        name,
        joinedAt: Date.now()
      };
    }

    async function createRoom() {
      setStatus(lobbyStatus, "");

      const nickname = cleanNickname(nicknameInput.value);

      if (!nickname) {
        setStatus(lobbyStatus, "請先輸入玩家暱稱。", true);
        nicknameInput.focus();
        return;
      }

      localStorage.setItem("rps_player_name", nickname);

      createRoomBtn.disabled = true;
      joinRoomBtn.disabled = true;

      setStatus(lobbyStatus, "正在建立房間…");

      try {
        for (let i = 0; i < 30; i++) {
          const code = randomRoomCode();
          const newRoomRef = ref(db, "rooms/" + code);

          const result = await runTransaction(
            newRoomRef,
            (current) => {
              if (current !== null) return;

              return {
                createdAt: Date.now(),
                hostId: playerId,
                status: "waiting",
                round: 0,
                players: {
                  [playerId]: makePlayer(nickname)
                }
              };
            }
          );

          if (result.committed) {
            await enterRoom(code, newRoomRef);
            return;
          }
        }

        throw new Error("暫時無法建立房號，請再試一次。");
      } catch (error) {
        console.error(error);

        setStatus(
          lobbyStatus,
          "建立房間失敗：" + (error.message || error),
          true
        );
      } finally {
        createRoomBtn.disabled = false;
        joinRoomBtn.disabled = false;
      }
    }

    async function joinRoom() {
      setStatus(lobbyStatus, "");

      const nickname = cleanNickname(nicknameInput.value);

      const code = roomCodeInput.value
        .replace(/\D/g, "")
        .slice(0, 4);

      if (!nickname) {
        setStatus(lobbyStatus, "請先輸入玩家暱稱。", true);
        nicknameInput.focus();
        return;
      }

      if (code.length !== 4) {
        setStatus(lobbyStatus, "請輸入 4 位數房號。", true);
        roomCodeInput.focus();
        return;
      }

      localStorage.setItem("rps_player_name", nickname);

      createRoomBtn.disabled = true;
      joinRoomBtn.disabled = true;

      setStatus(lobbyStatus, "正在加入房間…");

      try {
        const targetRoomRef = ref(db, "rooms/" + code);

        // 先讀取雲端房間資料，避免 transaction 第一次拿到 null 時中止。
        const snapshot = await get(targetRoomRef);

        if (!snapshot.exists()) {
          throw new Error("找不到這個房間，請確認房號。");
        }

        const room = snapshot.val();

        if (room.status !== "waiting") {
          throw new Error("這個房間已開始遊戲，暫時不能加入。");
        }

        const players = room.players || {};
        const playerCount = Object.keys(players).length;

        if (playerCount >= 3) {
          throw new Error("這個房間已滿，最多 3 人。");
        }

        // 只新增自己的玩家節點，不覆蓋整個房間。
        const myPlayerRef = ref(
          db,
          `rooms/${code}/players/${playerId}`
        );

        await set(
          myPlayerRef,
          makePlayer(nickname)
        );

        await enterRoom(code, targetRoomRef);

      } catch (error) {
        console.error(error);

        setStatus(
          lobbyStatus,
          "加入房間失敗：" + (error.message || error),
          true
        );
      } finally {
        createRoomBtn.disabled = false;
        joinRoomBtn.disabled = false;
      }
    }

    async function enterRoom(code, targetRoomRef) {
      if (unsubscribeRoom) {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }

      roomCode = code;
      roomDatabaseRef = targetRoomRef;

      roomCodeText.textContent = code;
      roomCodeInput.value = code;

      lobbyScreen.classList.add("hidden");
      roomScreen.classList.remove("hidden");

      setStatus(lobbyStatus, "");
      setStatus(roomStatus, "等待其他玩家…");

      unsubscribeRoom = onValue(
        roomDatabaseRef,
        (snapshot) => {
          const data = snapshot.val();

          if (!data) {
            alert("房間已不存在。");
            resetLocalRoom();
            return;
          }

          currentRoom = data;
          renderRoom(data);
        },
        (error) => {
          console.error(error);
          setStatus(
            roomStatus,
            "讀取房間失敗：" + error.message,
            true
          );
        }
      );

      const playerRef = ref(
        db,
        `rooms/${code}/players/${playerId}`
      );

      playerDisconnect = onDisconnect(playerRef);
      await playerDisconnect.remove();
    }

    function renderRoom(room) {
      const players = room.players || {};
      const entries = Object.entries(players);
      const playerIds = entries.map(([id]) => id);

      const isHost = room.hostId === playerId;
      const hostStillHere = playerIds.includes(room.hostId);

      const allPicked =
        entries.length >= 2 &&
        entries.every(([, player]) => Boolean(player.choice));

      const me = players[playerId];
      const myChoice = me ? me.choice : null;

      playerCountBadge.textContent =
        `玩家 ${entries.length} / 3`;

      roundBadge.textContent =
        `ROUND ${room.round || 0}`;

      playersList.innerHTML = "";

      entries
        .sort(
          (a, b) =>
            Number(a[1].joinedAt || 0) -
            Number(b[1].joinedAt || 0)
        )
        .forEach(([id, player], index) => {
          const row = document.createElement("div");
          row.className =
            "player" + (id === playerId ? " me" : "");

          const slot = document.createElement("div");
          slot.className = "slot";
          slot.textContent = index + 1;

          const name = document.createElement("div");
          name.className = "player-name";
          name.textContent =
            player.name +
            (id === room.hostId ? " [HOST]" : "") +
            (id === playerId ? " [YOU]" : "");

          const state = document.createElement("div");
          state.className = "player-state";

          if (room.status === "waiting") {
            state.textContent = "READY";
          } else if (allPicked) {
            state.textContent = choiceLabel(player.choice);
          } else {
            state.textContent = player.choice
              ? "已出拳"
              : "思考中…";
          }

          row.append(slot, name, state);
          playersList.appendChild(row);
        });

      const canChoose =
        room.status === "choosing" &&
        Boolean(me) &&
        !allPicked;

      choiceButtons.forEach((button) => {
        button.disabled = !canChoose;

        button.classList.toggle(
          "selected",
          button.dataset.choice === myChoice
        );
      });

      startGameBtn.style.display =
        room.status === "waiting" ? "" : "none";

      startGameBtn.disabled =
        !(
          isHost &&
          entries.length >= 2 &&
          entries.length <= 3
        );

      if (isHost) {
        startGameBtn.textContent =
          entries.length >= 2
            ? "開始猜拳"
            : "至少需要 2 人";
      } else {
        startGameBtn.textContent = "等待房主開始";
      }

      resultBox.classList.toggle(
        "hidden",
        !allPicked
      );

      if (allPicked) {
        const result = calculateResult(entries);

        resultTitle.textContent = result.title;
        revealList.innerHTML = "";

        entries.forEach(([id, player]) => {
          const row = document.createElement("div");
          row.className = "reveal-row";

          const left = document.createElement("span");
          left.textContent =
            player.name +
            (id === playerId ? " [YOU]" : "");

          const right = document.createElement("strong");
          right.textContent = choiceLabel(player.choice);

          row.append(left, right);
          revealList.appendChild(row);
        });

        nextRoundBtn.style.display = isHost ? "" : "none";
      }

      claimHostBtn.style.display =
        (!hostStillHere && Boolean(me))
          ? ""
          : "none";

      if (!hostStillHere) {
        setStatus(
          roomStatus,
          "房主已離線，可由任一玩家接手房主。"
        );
      } else if (room.status === "waiting") {
        setStatus(
          roomStatus,
          entries.length < 2
            ? "等待第 2 位玩家加入…"
            : (
                isHost
                  ? "人數已足夠，可以開始。"
                  : "等待房主開始。"
              )
        );
      } else if (allPicked) {
        setStatus(
          roomStatus,
          isHost
            ? "本回合完成，可開始下一回合。"
            : "本回合完成，等待房主開下一回合。"
        );
      } else {
        setStatus(
          roomStatus,
          myChoice
            ? "已出拳，等待其他玩家。"
            : "請選擇石頭、剪刀或布。"
        );
      }
    }

    function choiceLabel(choice) {
      return {
        rock: "石頭",
        scissors: "剪刀",
        paper: "布"
      }[choice] || "—";
    }

    function calculateResult(entries) {
      const choices = entries.map(
        ([id, player]) => ({
          id,
          name: player.name,
          choice: player.choice
        })
      );

      const unique = [
        ...new Set(
          choices.map((item) => item.choice)
        )
      ];

      if (unique.length === 1 || unique.length === 3) {
        return {
          title: "平手 / DRAW"
        };
      }

      const beats = {
        rock: "scissors",
        scissors: "paper",
        paper: "rock"
      };

      let winningChoice = null;

      for (const choice of unique) {
        const other =
          unique.find((item) => item !== choice);

        if (
          other &&
          beats[choice] === other
        ) {
          winningChoice = choice;
          break;
        }
      }

      if (!winningChoice) {
        return {
          title: "平手 / DRAW"
        };
      }

      const winners = choices.filter(
        (item) => item.choice === winningChoice
      );

      return {
        title:
          winners
            .map((item) => item.name)
            .join(" + ") +
          " WIN"
      };
    }

    async function startGame() {
      if (!roomDatabaseRef || !currentRoom) return;

      try {
        await runTransaction(
          roomDatabaseRef,
          (room) => {
            if (!room) return;

            if (room.hostId !== playerId) {
              return;
            }

            room.players = room.players || {};

            const playerCount =
              Object.keys(room.players).length;

            if (playerCount < 2 || playerCount > 3) {
              return;
            }

            room.status = "choosing";
            room.round = (room.round || 0) + 1;

            Object.values(room.players).forEach((player) => {
              delete player.choice;
            });

            return room;
          }
        );
      } catch (error) {
        console.error(error);
        setStatus(
          roomStatus,
          "開始遊戲失敗：" + error.message,
          true
        );
      }
    }

    async function choose(choice) {
      if (
        !roomDatabaseRef ||
        !currentRoom ||
        currentRoom.status !== "choosing"
      ) {
        return;
      }

      const me =
        currentRoom.players &&
        currentRoom.players[playerId];

      if (!me) return;

      const players =
        Object.values(currentRoom.players || {});

      const allPicked =
        players.length >= 2 &&
        players.every((player) => Boolean(player.choice));

      if (allPicked) return;

      try {
        const choiceRef = ref(
          db,
          `rooms/${roomCode}/players/${playerId}/choice`
        );

        await set(choiceRef, choice);
      } catch (error) {
        console.error(error);

        setStatus(
          roomStatus,
          "出拳失敗：" + error.message,
          true
        );
      }
    }

    async function nextRound() {
      if (!roomDatabaseRef || !currentRoom) return;

      try {
        await runTransaction(
          roomDatabaseRef,
          (room) => {
            if (!room) return;

            if (room.hostId !== playerId) {
              return;
            }

            room.players = room.players || {};

            const playerCount =
              Object.keys(room.players).length;

            if (playerCount < 2) {
              room.status = "waiting";

              Object.values(room.players).forEach((player) => {
                delete player.choice;
              });

              return room;
            }

            room.status = "choosing";
            room.round = (room.round || 0) + 1;

            Object.values(room.players).forEach((player) => {
              delete player.choice;
            });

            return room;
          }
        );
      } catch (error) {
        console.error(error);

        setStatus(
          roomStatus,
          "下一回合失敗：" + error.message,
          true
        );
      }
    }

    async function claimHost() {
      if (!roomDatabaseRef) return;

      try {
        await runTransaction(
          roomDatabaseRef,
          (room) => {
            if (!room) return;

            room.players = room.players || {};

            if (!room.players[playerId]) {
              return;
            }

            if (
              room.hostId &&
              room.players[room.hostId]
            ) {
              return;
            }

            room.hostId = playerId;

            return room;
          }
        );
      } catch (error) {
        console.error(error);

        setStatus(
          roomStatus,
          "接手房主失敗：" + error.message,
          true
        );
      }
    }

    async function leaveRoom() {
      if (!roomDatabaseRef) {
        resetLocalRoom();
        return;
      }

      try {
        if (playerDisconnect) {
          await playerDisconnect.cancel();
        }

        await runTransaction(
          roomDatabaseRef,
          (room) => {
            if (!room) return null;

            room.players = room.players || {};

            delete room.players[playerId];

            const remainingIds =
              Object.keys(room.players);

            if (remainingIds.length === 0) {
              return null;
            }

            if (
              room.hostId === playerId ||
              !room.players[room.hostId]
            ) {
              room.hostId = remainingIds[0];
            }

            if (
              remainingIds.length < 2 &&
              room.status !== "waiting"
            ) {
              room.status = "waiting";

              Object.values(room.players).forEach((player) => {
                delete player.choice;
              });
            }

            return room;
          }
        );
      } catch (error) {
        console.error(error);
      }

      resetLocalRoom();
    }

    function resetLocalRoom() {
      if (unsubscribeRoom) {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }

      roomDatabaseRef = null;
      currentRoom = null;
      roomCode = "";
      playerDisconnect = null;

      roomScreen.classList.add("hidden");
      lobbyScreen.classList.remove("hidden");

      resultBox.classList.add("hidden");
      playersList.innerHTML = "";

      setStatus(roomStatus, "");
    }

    async function copyRoomCode() {
      if (!roomCode) return;

      try {
        await navigator.clipboard.writeText(roomCode);

        setStatus(
          roomStatus,
          "房號已複製：" + roomCode
        );
      } catch {
        setStatus(
          roomStatus,
          "房號：" + roomCode
        );
      }
    }

    roomCodeInput.addEventListener(
      "input",
      () => {
        roomCodeInput.value =
          roomCodeInput.value
            .replace(/\D/g, "")
            .slice(0, 4);
      }
    );

    createRoomBtn.addEventListener(
      "click",
      createRoom
    );

    joinRoomBtn.addEventListener(
      "click",
      joinRoom
    );

    startGameBtn.addEventListener(
      "click",
      startGame
    );

    nextRoundBtn.addEventListener(
      "click",
      nextRound
    );

    claimHostBtn.addEventListener(
      "click",
      claimHost
    );

    leaveRoomBtn.addEventListener(
      "click",
      leaveRoom
    );

    copyRoomBtn.addEventListener(
      "click",
      copyRoomCode
    );

    choiceButtons.forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          choose(button.dataset.choice);
        }
      );
    });

    window.addEventListener("error", (event) => {
      console.error(event.error || event.message);
    });

    window.addEventListener("unhandledrejection", (event) => {
      console.error(event.reason);
    });
  </script>
</body>
</html>
